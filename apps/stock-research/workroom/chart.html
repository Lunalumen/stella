<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradingView 관심 종목 차트</title><style>html,body{height:100%;margin:0;background:#131722;color:#a9b7ab;font:12px system-ui,sans-serif}.tradingview-widget-container{height:100%;width:100%}.tradingview-widget-container__widget{height:calc(100% - 30px);width:100%}.tradingview-widget-copyright{text-align:center;line-height:30px}a{color:#b7d99c;text-decoration:none}</style></head><body>
<div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div><div class="tradingview-widget-copyright"><a href="https://www.tradingview.com/" target="_blank" rel="noopener noreferrer">Track all markets on TradingView</a></div></div>
<script>
'use strict';
const params=new URLSearchParams(location.search);
const allowed=['NASDAQ:GOOGL','NASDAQ:INTC','KRX:005930','NASDAQ:AAPL','NASDAQ:TSLA','AMEX:SPY','AMEX:SCHD'];
const symbol=allowed.includes(params.get('symbol'))?params.get('symbol'):'NASDAQ:GOOGL';
const interval=params.get('interval')==='W'?'W':'D';
const mini=params.get('mode')==='mini';
const overview=params.get('mode')==='etf';
const studies=[];
if(params.get('ma')!=='0'){
 for(const length of [20,60,120]) studies.push({id:'MASimple@tv-basicstudies',inputs:{length}});
}
if(params.get('rsi')!=='0')studies.push({id:'RSI@tv-basicstudies',inputs:{length:14}});
if(params.get('macd')==='1')studies.push({id:'MACD@tv-basicstudies',inputs:{}});
const script=document.createElement('script');script.src=overview?'https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js':mini?'https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js':'https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';script.async=true;
script.textContent=JSON.stringify(mini?{symbol,width:'100%',height:'100%',locale:'en',dateRange:'1M',colorTheme:'light',isTransparent:false,autosize:true,largeChartUrl:'',noTimeScale:false}:{autosize:true,symbol,interval,timezone:'Asia/Seoul',theme:'light',style:'1',locale:'en',allow_symbol_change:false,calendar:false,hide_side_toolbar:true,hide_volume:params.get('volume')==='0',studies,save_image:false,support_host:'https://www.tradingview.com'});
if(overview)script.textContent=JSON.stringify({symbols:[[symbol,symbol+'|'+(params.get('years')==='5'?'60M':'12M')]],dateRanges:params.get('years')==='5'?['60m|1W']:['12m|1D'],autosize:true,width:'100%',height:'100%',colorTheme:'light',locale:'en',chartType:'area',noTimeScale:false,hideDateRanges:false,hideMarketStatus:false,isTransparent:false});
script.onerror=()=>{document.querySelector('.tradingview-widget-container__widget').textContent='차트 연결이 되지 않았어요. 작업실의 TradingView에서 열기 링크를 이용해 주세요.';};
document.querySelector('.tradingview-widget-container').append(script);
</script></body></html>
